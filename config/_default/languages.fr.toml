  description = "Faire ensemble propose des pratiques simples pour que chacun puisse contribuer à la vigilance du groupe, quels que soient son expérience et sa connaissance des outils. La démarche accompagne les quatre temps d’une sortie montagne hivernale : préparer ensemble, s’accorder avant le départ, copiloter sur le terrain et débriefer pour apprendre."

